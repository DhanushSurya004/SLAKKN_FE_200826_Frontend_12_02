<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Box - Cricket Kit</title>
  <link rel="stylesheet" href="assets/css/stylethree.css">
</head>
<body>

  <h1>Cricket Kit Products</h1>

  <div class="product-container">

    <div class="box box1">
      <h2>Cricket Bat</h2>
      <p class="price">₹2,499</p>
      <p class="description">Premium English willow bat, ideal for professional matches.</p>
    </div>

    <div class="box box2">
      <h2>Cricket Helmet</h2>
      <p class="price">₹1,299</p>
      <p class="description">Lightweight helmet with steel grille for maximum head protection.</p>
    </div>

    <div class="box box3">
      <h2>Cricket Gloves</h2>
      <p class="price">₹899</p>
      <p class="description">Padded batting gloves offering comfort and firm grip.</p>
    </div>

  </div>

</body>
</html>
