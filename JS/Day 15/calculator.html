<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>

    <form id="calcForm">
        <input type="number" id="first" placeholder="First Number">
        <input type="number" id="second" placeholder="Second Number">
        <button type="submit" value="add">+</button>
        <button type="submit" value="sub">-</button>
        <button type="submit" value="multi">×</button>
        <button type="submit" value="divi">÷</button>
        <button type="button" id="clear">Clear</button>
    </form>

    <p id="answer"></p>

    <script src="assets/js/calculator.js"></script>
</body>
</html>
