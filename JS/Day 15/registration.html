<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>
</head>
<body>

    <h2>Employee Registration</h2>

    <form id="employeeForm">
        <input type="text" id="empName" placeholder="Employee Name">
        <input type="number" id="empAge" placeholder="Employee Age">
        <input type="text" id="empDept" placeholder="Department">
        <input type="number" id="empSalary" placeholder="Salary">
        <button type="submit">Submit</button>
    </form>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Department</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody id="employeeTable"></tbody>
    </table>

    <script src="assets/js/registration.js"></script>
</body>
</html>
