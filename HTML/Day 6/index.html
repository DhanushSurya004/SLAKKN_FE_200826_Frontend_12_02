<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
</head>
<body>
    <h2>Student Registration</h2>
    <form >
        <table >
            <tr>
                <td><label for="name">Name</label></td>
                <td><input type="text" minlength="5" maxlength="20" placeholder="Enter the Name" required></td>
            </tr>
            <tr>
                <td><label for="age">Age</label></td>
                <td><input type="number" min="18" max="25" required></td>
            </tr>
            <tr>
                <td><label for="phone">Phone</label></td>
                <td><input type="number" minlength="10" maxlength="10" required></td>
            </tr>
            <tr>
                <td><label for="email">Email</label></td>
                <td><input type="email" required></td>
            </tr>
            <tr>
                <td><label for="pass">Password</label></td>
                <td><input type="password" minlength="8" maxlength="15" required></td>
            </tr>
            <tr>
                <td><label for="gender">Gender</label></td>
                <td><input type="radio" name="gend" value="male" required>Male
                    <input type="radio" name="gend" value="female">Female                
                </td>
            </tr>
            <tr>
                <td><label for="course">Course</label></td>
                <td><select name="course" id="course" required>
                    <option value="fs">Full Stack</option>
                    <option value="ml">Machine Learning</option>
                    <option value="da">Data Analyst</option>
                </select></td>
            </tr>

            <tr>
                <td><label for="skills">Skills</label></td>
                <td><input type="checkbox" value="skl" required>Java
                    <input type="checkbox" value="skl">Python
                    <input type="checkbox" value="skl">HTML
                    <input type="checkbox" value="skl">CSS
                    <input type="checkbox" value="skl">SQL
                    <input type="checkbox" value="skl">MongoDB
                </td>
            </tr>

            <tr>
                <td><button type="submit">Register</button></td>
            </tr>
        </table>
    </form>
</body>
</html>
