<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Task 3</title>
</head>
<body>

<div>
    <h1>Mini Product Page </h1>

    <p><strong>Product Name:</strong> Laptop<br>
    <strong>Price:</strong> ₹55,000</p>

    <strong>Features:</strong>
    <ul>
        <li>16GB RAM</li>
        <li>512GB SSD</li>
        <li>Intel Processor</li>
        <li>15.6-inch Display</li>
    </ul>

    <strong>Product Specifications:</strong>
    <table border="1">
        <tr>
            <th>Specification</th>
            <th>Details</th>
        </tr>
        <tr>
            <td>RAM</td>
            <td>16GB</td>
        </tr>
        <tr>
            <td>Storage</td>
            <td>512GB SSD</td>
        </tr>
        <tr>
            <td>Processor</td>
            <td>Intel Processor</td>
        </tr>
        <tr>
            <td>Display</td>
            <td>15.6-inch</td>
        </tr>
    </table>

    <h2>Order Form</h2>

    <form>
        <label for="customerName">Customer Name:</label>
        <input type="text" id="customerName" name="customerName"><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone"><br>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="1"><br>

        <label for="address">Address:</label>
        <textarea id="address" name="address" rows="3" cols="30"></textarea><br>

        <button type="submit">Order</button>
    </form>
</div>

</body>
</html>
