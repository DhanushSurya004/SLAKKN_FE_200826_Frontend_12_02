<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrickGear</title>
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css"rel="stylesheet"/>
</head>
<body>

  
  <nav class="navbar navbar-dark bg-dark">
    <div class="container d-flex justify-content-between align-items-center flex-wrap">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="assets/images/logo/logo.svg" alt="CrickGear Logo" height="40" class="me-2" />
        CrickGear
      </a>
      <ul class="nav">
        <li class="nav-item">
          <a class="nav-link text-white" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="#">Bats</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="#">Balls</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="#">Protective Gear</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="#contact-form">Contact</a>
        </li>
      </ul>
    </div>
  </nav>

  
  <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="assets/images/banner/bats.svg" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Cricket Bats" />
        <div class="carousel-caption d-none d-md-block">
          <h5>Premium Cricket Bats</h5>
          <p>Handpicked willow bats for every player.</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="assets/images/banner/balls.svg" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Cricket Balls" />
        <div class="carousel-caption d-none d-md-block">
          <h5>Match Quality Balls</h5>
          <p>Leather and tennis balls for every format.</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="assets/images/banner/gear.svg" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Protective Gear" />
        <div class="carousel-caption d-none d-md-block">
          <h5>Protective Gear</h5>
          <p>Pads, helmets, and gloves built for safety.</p>
        </div>
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

 
  <div class="container my-5" id="contact-form">
    <h2 class="mb-4 text-center">Enquire About Our Gear</h2>
    <form class="mx-auto" style="max-width: 500px;">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" placeholder="Enter your name" />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email" />
      </div>
      <div class="mb-3">
        <label for="product" class="form-label">Product Interested In</label>
        <select class="form-select" id="product">
          <option selected>Choose an option</option>
          <option>Cricket Bat</option>
          <option>Cricket Ball</option>
          <option>Protective Gear</option>
          <option>Other</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" rows="4" placeholder="Your message"></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">Submit</button>
    </form>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
