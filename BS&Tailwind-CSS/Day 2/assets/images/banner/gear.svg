  <defs>
    <linearGradient id="fade3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a2a4a"/>
      <stop offset="1" stop-color="#2e4a7a"/>
    </linearGradient>
  </defs>
  <!-- Helmet -->
