  </g>

  <text x="80" y="180" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#f4c542">Protective Gear</text>
  <text x="80" y="225" font-family="Arial, sans-serif" font-size="22" fill="#dbe4f0">Pads, helmets, and gloves built for safety</text>
