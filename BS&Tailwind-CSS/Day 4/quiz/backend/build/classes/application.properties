spring.application.name=quizmaster-backend
server.port=${SERVER_PORT:8080}

# Set DB_URL, DB_USERNAME, and DB_PASSWORD in your environment before starting the API.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quizmaster?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always
